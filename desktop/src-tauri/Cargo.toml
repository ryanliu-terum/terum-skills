[package]
name = "terum-skills-desktop"
version = "0.1.5"
description = "Terum Skills desktop shell: a Tauri window around the desktop frontend that drives the terum-skills CLI over frames"
authors = ["Terum"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "terum_skills_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-window-state = "2"
