name: Release

# terum-skills release: ONE explicit dispatch per intentional release, on main, for a named version at a
# named merged commit. Order: validate → build/test/pack (read-only) → publish + verify (npm environment,
# OIDC) → tag + GitHub Release (contents: write) → audit. The tag is created only after the registry
# serves the exact bytes we packed, with a gitHead equal to the dispatched commit and a provenance attestation.
# The attestation is advisory (it names the builder, not the commit); the digest and gitHead are the gates.
# Nothing here bumps versions.
#
# Recovery: re-dispatch with the SAME expected_version and expected_sha; scripts/release-plan.mjs
# decides which of publish / tag / release is still missing (see its recovery table) and the jobs skip
# the rest. Dry run (default) stops after packaging: it proves gates, the tarball, the environment
# approval, and permission declarations — NOT the npm or GitHub writes.
#
# One-time setup (Ryan): npm Trusted Publisher (ryanliu-terum / terum-skills / release.yml / env npm);
# GitHub environment `npm` restricted to main with a required reviewer; branch protection on main.
# Trusted publishing needs npm >= 11.5.1 on Node >= 22.14 (docs.npmjs.com/trusted-publishers).
# Since 0.1.6 the desktop app (desktop/) is built in the same run on macOS and Windows runners and attached to
# the Release before anything is tagged; the npm publish waits on those builds. See .planning/decisions/
# 2026-09-08-desktop-app-cli-decision-walk.md (D2, D3) and docs/frame-protocol.md.

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Version to release; must equal package.json "version" at expected_sha (e.g. 0.1.1)'
        required: true
        type: string
      expected_sha:
        description: 'Full 40-hex SHA of the merged commit on main to release; must equal the dispatch SHA'
        required: true
        type: string
      dry_run:
        description: 'Gates + pack + smoke only. No publish, no tag, no Release.'
        type: boolean
        default: true
      dist_tag:
        description: 'npm dist-tag to publish under. latest (default) is refused for a stable version older than the newest published stable; pass another tag (e.g. previous) to backfill. Prereleases publish under next unless this overrides it.'
        required: false
        type: string
        default: latest

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: terum-skills
  NPM_CLI_VERSION: 11.11.1   # >= 11.5.1; the version exercised for 0.1.0; bump deliberately

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      state: ${{ steps.plan.outputs.state }}
      reason: ${{ steps.plan.outputs.reason }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      mark_latest: ${{ steps.plan.outputs.mark_latest }}
    steps:
      - name: Dispatch must target main at the SHA being released
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || { echo "::error::dispatch ref is $REF, not refs/heads/main"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected_sha must be a full 40-hex SHA"; exit 1; }
          [ "$EXPECTED_SHA" = "$SHA" ] || { echo "::error::expected_sha $EXPECTED_SHA != dispatch sha $SHA (main moved; re-dispatch on the intended commit)"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merged-PR evidence and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on origin/main (force-push?)"; exit 1; }
          merged=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" --jq '[.[] | select(.merged_at != null)] | length')
          parents=$(git rev-list --parents -n 1 "$SHA" | wc -w)
          if [ "$merged" = "0" ] && [ "$parents" -lt 3 ]; then
            echo "::error::$SHA is neither a merged PR's commit nor a merge commit; release from a reviewed merge"; exit 1
          fi
      - id: plan
        name: Plan (live observations of git tags, registry, Releases)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          SHA: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: node scripts/release-plan.mjs --plan --version "$EXPECTED_VERSION" --sha "$SHA" --dist-tag "${DIST_TAG:-latest}" --github-output >> "$GITHUB_OUTPUT"
      - name: Report the plan
        env:
          STATE: ${{ steps.plan.outputs.state }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          echo "state=$STATE"; echo "$REASON"
          case "$STATE" in
            refuse|observation-error) echo "::error::$REASON"; exit 1 ;;
            noop) echo "::notice::$REASON" ;;
          esac

  build:
    needs: validate
    if: needs.validate.outputs.state == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      integrity: ${{ steps.pack.outputs.integrity }}
      filename: ${{ steps.pack.outputs.filename }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - id: pack
        name: Pack once (prepack builds dist/) and retain the digest
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release
          # npm records gitHead only when publishing from a directory with a real .git; a tarball publish would
          # leave the registry with no commit link. Stamp it into the packed manifest (uncommitted) so the registry
          # carries the source evidence that release-plan.mjs and the drift audit require.
          npm pkg set "gitHead=$SHA"
          npm pack --json --pack-destination release > release/pack.json
          git checkout -- package.json
          # shellcheck disable=SC2016 # the single-quoted block is JavaScript handed to node -e, not shell
          node -e '
            const [p] = JSON.parse(require("fs").readFileSync("release/pack.json","utf8"));
            const out = `integrity=${p.integrity}\nfilename=${p.filename}\n`;
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out);
            const files = p.files.map(f => f.path);
            for (const must of ["package.json","README.md","LICENSE","NOTICE","dist/index.js","dist/claude/skills/terum-skills/SKILL.md"])
              if (!files.includes(must)) { console.error(`tarball lacks ${must}`); process.exit(1); }
            if (files.some(f => f.includes("__tests__") || f.startsWith("src/"))) { console.error("tarball ships sources/tests"); process.exit(1); }
          '
      - name: Smoke-test the packed tarball from a foreign directory
        env:
          FILENAME: ${{ steps.pack.outputs.filename }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp "release/$FILENAME" "$tmp/"
          (cd "$tmp" && npm init -y >/dev/null && npm install --no-audit --no-fund "./$FILENAME" >/dev/null)
          (cd /tmp && HOME="$tmp/home" "$tmp/node_modules/.bin/terum-skills" --help | grep -q 'npx -y terum-skills@latest setup')
          (cd /tmp && HOME="$tmp/home" node "$tmp/node_modules/terum-skills/dist/index.js" --help >/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: release/
          if-no-files-found: error
          retention-days: 30

  # Decision walk D2 (2026-09-08): the desktop app is built here, before the npm approval, and attached to the
  # same Release, so a CLI version can never be published without its app. Section 7 defaults: ad-hoc signing
  # ("-") plus .app.tar.gz, artifact-exists gate, windows-11-vs2026-arm with NSIS, no updater JSON. Linux is
  # gated (D3). Runs on dry runs too: that is how the matrix is proven without publishing.
  desktop:
    needs: validate
    if: needs.validate.outputs.state == 'publish'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app
            suffix: aarch64.app.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app
            suffix: x64.app.tar.gz
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            suffix: arm64-setup.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Build only: no tagName, so tauri-action never touches a Release and never writes updater JSON.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Package and gate (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          V: ${{ needs.validate.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          APP=$(find "src-tauri/target/$TARGET/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then echo "::error::no .app produced for $TARGET"; exit 1; fi
          # The ad-hoc signature must verify, or Gatekeeper shows "damaged" instead of "could not verify".
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q 'Signature=adhoc' || { echo "::error::expected an ad-hoc signature"; exit 1; }
          mkdir -p out
          OUT="out/terum-skills-desktop_${V}_${SUFFIX}"
          tar -czf "$OUT" -C "$(dirname "$APP")" "$(basename "$APP")"
          (cd out && shasum -a 256 "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          ls -la out
      - name: Package and gate (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          V: ${{ needs.validate.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          EXE=$(find "src-tauri/target/$TARGET/release/bundle/nsis" -maxdepth 1 -name '*-setup.exe' -print -quit)
          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then echo "::error::no NSIS installer produced for $TARGET"; exit 1; fi
          mkdir -p out
          OUT="out/terum-skills-desktop_${V}_${SUFFIX}"
          cp "$EXE" "$OUT"
          (cd out && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.suffix }}
          path: desktop/out/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [validate, build, desktop]
    if: needs.validate.outputs.state == 'publish' && inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # OIDC → npm trusted publishing; provenance is automatic
      contents: read
    steps:
      - uses: actions/checkout@v4   # the verify step needs scripts/release-plan.mjs, package.json and the git remote; before download so checkout's clean cannot remove release/
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: release/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g "npm@${NPM_CLI_VERSION}" && npm --version
      - name: Publish the retained tarball
        env:
          FILENAME: ${{ needs.build.outputs.filename }}
          DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
        # If the first real run shows no attestation for a tarball spec, switch to `npm publish --provenance`
        # from a checkout at github.sha in this job and keep the integrity comparison below as the artifact check.
        # DIST_TAG comes from the validated dispatch input (latest is refused for an out-of-order stable).
        run: npm publish "./release/$FILENAME" --provenance --access public --tag "$DIST_TAG"
      - name: Verify the registry serves these bytes, from this commit, with provenance
        env:
          V: ${{ needs.validate.outputs.version }}
          EXPECTED_INTEGRITY: ${{ needs.build.outputs.integrity }}
          SHA: ${{ github.sha }}
        run: node scripts/release-plan.mjs --verify-publication --version "$V" --sha "$SHA" --integrity "$EXPECTED_INTEGRITY"

  finalize:
    needs: [validate, build, desktop, publish]
    # Runs for a fresh publish, and for the two recovery states that need no publish. `always()` lets the
    # skipped build/publish jobs pass through; the explicit state test keeps refusals and dry runs out.
    if: >-
      always() && inputs.dry_run == false &&
      (needs.validate.outputs.state == 'tag-only' || needs.validate.outputs.state == 'release-only' ||
       (needs.validate.outputs.state == 'publish' && needs.publish.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-verify publication before writing anything
        env:
          V: ${{ needs.validate.outputs.version }}
          SHA: ${{ github.sha }}
        run: node scripts/release-plan.mjs --verify-publication --version "$V" --sha "$SHA"
      - name: Annotated tag at the released commit (no force; re-read on error)
        env:
          V: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          existing=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
          if [ -z "$existing" ]; then
            git tag -a "$TAG" "$SHA" -m "terum-skills $V — published to npm from $SHA by release.yml run $GITHUB_RUN_ID"
            if ! git push origin "refs/tags/$TAG"; then
              existing=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
              [ "$existing" = "$SHA" ] || { echo "::error::tag push failed and remote $TAG is '${existing:-absent}'"; exit 1; }
            fi
          else
            [ "$existing" = "$SHA" ] || { echo "::error::remote $TAG already points at $existing, not $SHA; never moved"; exit 1; }
          fi
      - uses: actions/download-artifact@v4
        # The recovery states (tag-only, release-only) have no desktop artifacts in this run; the gate below then
        # refuses to create a Release without them, which is the intended failure (re-run a full publish instead).
        if: needs.validate.outputs.state == 'publish'
        with:
          pattern: desktop-*
          path: desktop-assets/
          merge-multiple: true
      - name: Artifact-exists gate (D2). Every desktop asset for this version must be present and non-trivial.
        env:
          V: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          fail=0
          for suffix in aarch64.app.tar.gz x64.app.tar.gz arm64-setup.exe; do
            f="desktop-assets/terum-skills-desktop_${V}_${suffix}"
            if [ ! -f "$f" ]; then echo "::error::missing desktop asset $f"; fail=1; continue; fi
            size=$(wc -c < "$f")
            [ "$size" -gt 1000000 ] || { echo "::error::desktop asset $f is only $size bytes"; fail=1; }
            [ -f "$f.sha256" ] || { echo "::error::missing checksum $f.sha256"; fail=1; }
            (cd desktop-assets && shasum -a 256 -c "$(basename "$f").sha256") || fail=1
          done
          [ "$fail" -eq 0 ] || exit 1
          ls -la desktop-assets
      - name: GitHub Release with the desktop assets (created only if missing; never re-marked Latest on retry)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          PREVIOUS: ${{ needs.validate.outputs.previous_tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          MARK_LATEST: ${{ needs.validate.outputs.mark_latest }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG exists; left untouched"; exit 0; fi
          args=(--verify-tag --title "terum-skills $V" --generate-notes --latest="$MARK_LATEST")
          [ -n "$PREVIOUS" ] && args+=(--notes-start-tag "$PREVIOUS")
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" desktop-assets/*

  audit:
    needs: [validate, build, desktop, publish, finalize]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Drift audit after this run (fails the run on an incomplete release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-plan.mjs --drift
